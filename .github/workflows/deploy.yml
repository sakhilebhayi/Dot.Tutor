name: Deploy to Production

# Manual release of Dot.Tutor to tutor.infodot.co.za. Nothing deploys on a push: run it from the Actions tab
# (Use workflow from: main), or
#   gh workflow run deploy.yml --ref main -f confirm=deploy
#
# Until the repository secrets below are set, a run stops in its first job ("Check the inputs") with a message naming
# the missing secret, before any test minute is spent and before anything reaches a server.
#
# Two modes, chosen by the `confirm` input:
#   adopt   ONE TIME, for a live folder that is not yet on this pipeline:
#           either an uploaded copy (no .git) or a checkout of the host's own
#           history that was never pushed (drift.yml says which; the code
#           version is unknown either way). Run drift.yml first and read it.
#           `adopt` takes a rollback copy of the whole folder, turns it
#           into a checkout of origin/main (host-only commits are kept on a
#           local host-before-adopt-* branch) WITHOUT deleting anything untracked
#           (.env, storage/, database/, uploads) and then continues as a deploy,
#           except that pending migrations are only LISTED unless `migrate` is
#           also given.
#   deploy  Every release after that: needs the checkout on this pipeline.
#
# Optional input: skip_db_dump=skip deploys without the pre-migration database copy (only when the host cannot make one
# and you took your own).
#
# What a run does, in order:
#   0. Refuses to run from any branch but main, or while a deploy secret is missing.
#   1. CI gate (ci.yml): PHPUnit on SQLite and on PostgreSQL 16, the upgrade rehearsal on a populated pre-R-47 database
#      (both engines), the JS suite, the Vite build with the manifest check, and the signed-in production-like smoke
#      (learner, tutor, guardian, operator).
#   2. Builds the frontend on the runner (the host has no Node), proves the manifest against every @vite entry in the
#      views (scripts/ops/check-vite-manifest.mjs) and stages it in public/build.incoming on the host.
#   3. On the host, BEFORE maintenance mode: a rollback copy of the files and a copy of the database (pg_dump custom
#      format, or an online SQLite backup, whichever DB_CONNECTION the host .env names; a failure here leaves the live
#      site untouched). Then maintenance mode, code to origin/main, composer install, production invariants (APP_DEBUG
#      forced false, APP_ENV forced production, warnings for an http APP_URL, a reverb broadcaster, redis or sync
#      drivers), the new public/build swapped in, the docroot's copies of build/ AND of every other public file (fonts,
#      icons, images, the push script, the service worker /comms-sw.js at the site root, favicons) kept in step, the
#      private upload folders created, migrations, `php artisan academic:sync` (the academic reference data: languages,
#      curricula, levels, subjects, offerings; idempotent, never overwrites an operator's edit), caches, tutor:preflight
#      (a FAIL leaves the site down with the reason), `php artisan up`.
#   4. Installs this app's cron lines through the account's shared crontab (the file every Dot app on this cPanel account
#      writes to). Two lines carry every scheduled command:
#        `schedule:run` every minute: comms:deliver and classroom:sweep every minute; money:settle,
#        tutor:expire-marketplace-holds, comms:reminders and safety:escalate-incidents every 5 minutes;
#        safety:expire-approvals hourly; tutor:expire-stale-sessions 02:00, money:reconcile 02:30, tutor:publish-metrics
#        03:00 UTC, ai:purge-interactions 03:30 UTC, comms:prune 03:40 UTC, safety:audit-verify 04:00 UTC,
#        money:draft-payouts 06:00 (14 tasks; tutor:preflight checks each is registered).
#        `queue:work` -- cron-driven (--stop-when-empty --max-time=50, every second minute on this app's parity; cPanel
#        allows no daemon). Queued: Paystack webhooks, notification delivery, the Analytics snapshot.
#      The write takes the shared flock, reads the crontab with a retry (crontab -l can transiently answer EMPTY;
#      nothing is written after an empty read), replaces only lines carrying this app's marker ("# dot-tutor"), and
#      verifies the read-back: other apps' lines before and after must match or the previous crontab is restored. Then
#      queue:restart so a worker started before the release exits.
#   5. Smoke check from the runner, like a browser: /, /login and /up answer 200; the learner, tutor, guardian and
#      operator pages redirect a guest to the login; a guessed private file URL answers 403 or 404; the security headers
#      (and the CSP mode) are present; every built CSS/JS file, every self-hosted font, the icon sprites, the service
#      worker at the site root with a JavaScript type and one file of every static folder answer 200 from the DOCROOT;
#      private storage and the app folder are not served; a POST /up (a harmless 405) is not a debug page.
#
# A failure after maintenance mode starts LEAVES the site down on purpose, with the rollback copy's name in the log,
# rather than guessing at an automatic rollback (the Dot.Agents pipeline's rollback fired after failures that never
# touched the server). To bring it back: fix the cause and re-run this workflow, or restore the copies and run
# `php artisan up` on the host. A failure in step 4 or 5 happens after `php artisan up`: the site is serving the new
# release and the run is red because a cron line or a check failed.
#
# REVERB: Reverb cannot run on shared cPanel (a long-lived websocket server). THIS PIPELINE NEVER STARTS, RELOADS OR
# PROXIES REVERB, and nothing needs it: Dot.Tutor broadcasts nothing; the classroom, inbox and room screens poll short
# versioned feeds. Set BROADCAST_CONNECTION=log in the host .env.
#
# Repository secrets: DEPLOY_HOST (tutor.infodot.co.za), DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. DEPLOY_PATH
# is optional: left unset, the app folder is found as the one `artisan` under the docroot ~/<DEPLOY_HOST>.
# docs/deployment.md has the host checklist; docs/R47_OPERATIONS.md the owner runbook (first steps after the first
# R-47 deploy, monitoring, rollback, incidents).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" for a release, or "adopt" for the one-time takeover of the hand-uploaded folder'
        required: true
      migrate:
        description: 'adopt only: type "migrate" to also run pending migrations (a normal deploy always migrates)'
        required: false
      skip_db_dump:
        description: 'type "skip" to deploy WITHOUT the pre-migration database copy (only if the host cannot make one and you took your own)'
        required: false

concurrency:
  group: tutor-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://tutor.infodot.co.za
  REPO_URL: https://github.com/sakhilebhayi/Dot.Tutor.git
  # The branch the host runs (and the only branch a run may start from).
  DEPLOY_BRANCH: main

jobs:
  confirm:
    name: Check the inputs
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.in.outputs.mode }}
      migrate: ${{ steps.in.outputs.migrate }}
      skipdump: ${{ steps.in.outputs.skipdump }}
    steps:
      - id: in
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          MIGRATE_INPUT: ${{ github.event.inputs.migrate }}
          SKIP_DUMP_INPUT: ${{ github.event.inputs.skip_db_dump }}
          HAVE_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          HAVE_USER: ${{ secrets.DEPLOY_USER != '' }}
          HAVE_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAVE_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          case "$CONFIRM" in
            deploy|adopt) ;;
            *) echo '::error::Confirmation input must be exactly "deploy" or "adopt" -- aborting.'; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" != "$DEPLOY_BRANCH" ]; then
            echo "::error::Started from '$GITHUB_REF_NAME'. Use workflow from branch '$DEPLOY_BRANCH': the build and the CI gate must run on the code the host will check out."
            exit 1
          fi
          # Only the names of missing secrets are printed, never a value.
          MISSING=""
          [ "$HAVE_HOST" = "true" ] || MISSING="$MISSING DEPLOY_HOST"
          [ "$HAVE_USER" = "true" ] || MISSING="$MISSING DEPLOY_USER"
          [ "$HAVE_KEY" = "true" ] || MISSING="$MISSING DEPLOY_SSH_KEY"
          [ "$HAVE_KNOWN_HOSTS" = "true" ] || MISSING="$MISSING DEPLOY_KNOWN_HOSTS"
          if [ -n "$MISSING" ]; then
            echo "::error::Repository secret(s) not set:$MISSING. The host is not set up for this pipeline yet; see docs/deployment.md. Nothing was run."
            exit 1
          fi
          echo "mode=$CONFIRM" >> "$GITHUB_OUTPUT"
          if [ "$SKIP_DUMP_INPUT" = "skip" ]; then echo "skipdump=yes" >> "$GITHUB_OUTPUT"; else echo "skipdump=no" >> "$GITHUB_OUTPUT"; fi
          # A normal release always migrates; the takeover only on request.
          if [ "$CONFIRM" = "deploy" ] || [ "$MIGRATE_INPUT" = "migrate" ]; then
            echo "migrate=yes" >> "$GITHUB_OUTPUT"
          else
            echo "migrate=no" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: CI gate
    needs: confirm
    uses: ./.github/workflows/ci.yml

  deploy:
    name: ${{ needs.confirm.outputs.mode }} tutor.infodot.co.za
    needs: [confirm, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # No .env exists on the runner, so no VITE_* variable (for example VITE_REVERB_APP_KEY) is baked into the bundle:
      # the browser code ships with its optional features off and never opens a websocket.
      - name: Build the frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s public/build/manifest.json
          # Every @vite entry named in a Blade view is in the manifest, every manifest file exists, and no view that
          # uses @vite names a resources/ path that is not a real entry (a comment did that to Dot.Auction's deploy).
          # "Unable to locate file in Vite manifest" is a 500 on every page.
          node scripts/ops/check-vite-manifest.mjs

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Locate the app on the host
        # DEPLOY_PATH is optional. Without it the app is found as the single
        # `artisan` within two levels of the docroot ~/<DEPLOY_HOST>; zero or
        # several is an error, not a guess.
        run: |
          APP="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$APP" ]; then
            APP="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                SITE="${{ secrets.DEPLOY_HOST }}" \
                'bash -s' <<'FIND'
          set -euo pipefail
          D="$HOME/$SITE"
          [ -d "$D" ] || { echo "no docroot $D on the host: create the cPanel subdomain first (docs/deployment.md)" >&2; exit 1; }
          A="$(find "$D" -maxdepth 2 -name artisan -type f -exec dirname {} \; | sort -u)"
          if [ "$(printf '%s\n' "$A" | grep -c .)" != 1 ]; then
            echo "expected exactly one Laravel app under the docroot, found: ${A:-none}" >&2
            exit 1
          fi
          printf '%s\n' "$A"
          FIND
            )"
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "App directory: ${APP#/home/}"

      # Staged beside the live build so the swap on the host is two renames,
      # and a failed upload leaves the running site untouched.
      - name: Upload the built frontend (staged)
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            public/build/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$APP_PATH/public/build.incoming/"

      - name: Deploy the code
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$APP_PATH" \
              MODE="${{ needs.confirm.outputs.mode }}" \
              MIGRATE="${{ needs.confirm.outputs.migrate }}" \
              SKIP_DB_DUMP="${{ needs.confirm.outputs.skipdump }}" \
              REPO_URL="$REPO_URL" \
              BRANCH="$DEPLOY_BRANCH" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          DOCROOT="$(dirname "$DEPLOY_PATH")"
          APPDIR="$(basename "$DEPLOY_PATH")"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          # An explicit refspec: a checkout made with --single-branch only maps its own branch, and
          # `git fetch origin <branch>` alone would then leave origin/<branch> unresolved.
          REFSPEC="+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

          [ -f .env ] || { echo "::error::$DEPLOY_PATH has no .env. This pipeline updates a LIVE install; a first install needs its own bootstrap."; exit 1; }
          [ -d public/build.incoming ] || { echo "::error::the staged frontend (public/build.incoming) is missing -- the upload step did not run."; exit 1; }

          # ---- rollback copy, outside every web root; the newest three are kept
          BACKUP="$HOME/dot-tutor-$MODE-$STAMP.tgz"
          tar czf "$BACKUP" --exclude=./vendor --exclude=./node_modules --exclude=./storage/logs --exclude=./public/build --exclude=./public/build.incoming .
          chmod 600 "$BACKUP"
          ls -1t "$HOME"/dot-tutor-*.tgz | tail -n +4 | xargs -r rm -f
          echo "== Rollback copy: $BACKUP ($(du -h "$BACKUP" | cut -f1))  [restore: stop writes, tar xzf it over $DEPLOY_PATH]"

          # ---- database copy, BEFORE maintenance mode and before any migration
          # The tar above holds a SQLite file only when it lives inside the app folder, and never a PostgreSQL database.
          # R-47 extends tutor_profiles, tutor_sessions, session_ratings and subjects in place and backfills money columns
          # (scripts/ops/upgrade-rehearsal.sh proves it on a populated database), so a restore point is taken here from the
          # credentials in the host .env. A failure here leaves the live site on the previous release.
          envval() { { grep -E "^$1=" .env || true; } | tail -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
          DBC="$(envval DB_CONNECTION)"
          DBDUMP=""
          if [ "$SKIP_DB_DUMP" = "yes" ]; then
            echo "::warning::skip_db_dump=skip: NO database copy was taken by this run. Make sure you have your own."
          elif [ "$DBC" = "pgsql" ]; then
            command -v pg_dump >/dev/null 2>&1 || { echo "::error::pg_dump is not installed for this account, so no database restore point can be taken. Take your own dump, then run again with skip_db_dump=skip. The live site is untouched."; exit 1; }
            DBDUMP="$HOME/dot-tutor-db-$MODE-$STAMP.dump"
            if ! PGPASSWORD="$(envval DB_PASSWORD)" pg_dump --format=custom --no-owner --file="$DBDUMP" \
                 --host="$(envval DB_HOST)" --port="$(envval DB_PORT)" --username="$(envval DB_USERNAME)" "$(envval DB_DATABASE)"; then
              rm -f "$DBDUMP"
              echo "::error::pg_dump failed (see above), so no database restore point exists. The live site is untouched. Fix the cause, or take your own dump and run again with skip_db_dump=skip."; exit 1
            fi
            echo "== Database restore point: $DBDUMP ($(du -h "$DBDUMP" | cut -f1))  [restore: pg_restore --clean --if-exists --no-owner -d <database> <file>]"
          elif [ "$DBC" = "sqlite" ]; then
            SQLITE_FILE="$(envval DB_DATABASE)"
            [ -n "$SQLITE_FILE" ] || SQLITE_FILE="database/database.sqlite"
            case "$SQLITE_FILE" in /*) ;; *) SQLITE_FILE="$DEPLOY_PATH/$SQLITE_FILE" ;; esac
            [ -f "$SQLITE_FILE" ] || { echo "::error::DB_CONNECTION=sqlite but $SQLITE_FILE does not exist. The live site is untouched."; exit 1; }
            DBDUMP="$HOME/dot-tutor-db-$MODE-$STAMP.sqlite"
            # The online backup API copies a consistent snapshot while the site keeps writing (a plain cp of a busy
            # SQLite file, or of its -wal sidecar, can be torn). The PHP the app already runs on does it.
            if ! $PHP -r '$s = new SQLite3($argv[1], SQLITE3_OPEN_READONLY); $s->busyTimeout(10000); $d = new SQLite3($argv[2]); if (! $s->backup($d)) { exit(1); } $ok = $d->querySingle("PRAGMA integrity_check"); exit($ok === "ok" ? 0 : 1);' "$SQLITE_FILE" "$DBDUMP"; then
              rm -f "$DBDUMP"
              echo "::error::The SQLite backup failed (is the sqlite3 PHP extension enabled?). The live site is untouched. Copy the file yourself and run again with skip_db_dump=skip."; exit 1
            fi
            echo "== Database restore point: $DBDUMP ($(du -h "$DBDUMP" | cut -f1)), integrity ok  [restore: php artisan down, copy it over $SQLITE_FILE, remove $SQLITE_FILE-wal and -shm, php artisan up]"
          else
            echo "::error::DB_CONNECTION is '${DBC:-unset}': this pipeline can copy pgsql and sqlite only. Take your own database backup and run again with skip_db_dump=skip. The live site is untouched."; exit 1
          fi
          if [ -n "$DBDUMP" ]; then
            chmod 600 "$DBDUMP"
            ls -1t "$HOME"/dot-tutor-db-* 2>/dev/null | tail -n +4 | xargs -r rm -f
          fi

          # ---- application folder guard (tolerant: it cannot fail the deploy)
          # $DEPLOY_PATH sits inside the docroot (~/<host>/<key>), so without a deny file the web
          # server hands out its database, logs and vendor/ (found 2026-10-20). Same rules as
          # app-folder-guard.yml "apply". Placed BEFORE maintenance mode on purpose: a mistake here
          # can never leave the site down. The file is untracked, so the `git reset --hard` below
          # does not touch it. set +e and the `||` fallbacks keep a hiccup from failing the run.
          DOCROOT_IS_PUBLIC=0
          set +e
          GUARD_HT="$DEPLOY_PATH/.htaccess"
          GUARD_PARENT="$(cd "$(dirname "$DEPLOY_PATH")" 2>/dev/null && pwd -P)" || GUARD_PARENT=""
          # Once the subdomain's document root is <app>/public (the docroot move, InfoDot docs S-2e) the app
          # folder is not served at all, and a deny file in it would block the whole site: do not write one.
          # The host's own answer decides; a marker file is the fallback if the lookup fails.
          APP_REAL="$(cd "$DEPLOY_PATH" 2>/dev/null && pwd -P)" || APP_REAL=""
          CURRENT_DOCROOT="$(uapi --output=json DomainInfo single_domain_data domain=tutor.infodot.co.za 2>/dev/null | sed -n 's/.*"documentroot" *: *"\([^"]*\)".*/\1/p' | head -1)"
          if [ -n "$APP_REAL" ] && { [ "$CURRENT_DOCROOT" = "$APP_REAL/public" ] || [ -f "$DEPLOY_PATH/.docroot-is-public" ]; }; then
            echo "== app-folder guard: skipped (the document root is $APP_REAL/public; the app folder is not served)"
            DOCROOT_IS_PUBLIC=1
          elif [ -z "$GUARD_PARENT" ] || [ "$GUARD_PARENT" = "$(cd "${HOME:-/nonexistent}" 2>/dev/null && pwd -P)" ]; then
            echo "== app-folder guard: skipped (the app folder is not inside a docroot; a deny file there would block the whole site)"
          elif [ -f "$GUARD_HT" ] && grep -q 'Require all denied' "$GUARD_HT"; then
            echo "== app-folder guard: already present"
          elif [ -f "$GUARD_HT" ]; then
            cp "$GUARD_HT" "$GUARD_HT.before-guard" && printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> "$GUARD_HT" && echo "== app-folder guard: appended (original kept as .htaccess.before-guard)" || echo "::warning::app-folder guard: could not append to the app folder .htaccess; continuing"
          else
            printf '# Dot: the application folder is never served.\nRequire all denied\n' > "$GUARD_HT" && echo "== app-folder guard: written (new file)" || echo "::warning::app-folder guard: could not write the app folder .htaccess; continuing"
          fi
          set -e

          # A failure leaves the site exactly as it is -- DOWN if maintenance
          # mode had started -- and says which, with the way back.
          trap 'if [ -f storage/framework/down ]; then echo "::error::The deploy failed AFTER maintenance mode started. The site was left DOWN on purpose. Rollback copy: $BACKUP. Database copy: ${DBDUMP:-none}. Inspect the log above (or server-logs.yml) and run this workflow again, or restore the copies and run: php artisan up"; else echo "::error::The deploy failed BEFORE maintenance mode started; the site is still serving the previous release. Rollback copy: $BACKUP."; fi' ERR

          # Git hooks on the host never run during a release. The Forms host's old
          # checkout carried a Git LFS post-checkout hook but no git-lfs, so its
          # first adopt died on `git checkout` AFTER maintenance mode started.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null

          # ---- code
          if [ ! -d .git ]; then
            if [ "$MODE" != "adopt" ]; then
              echo "::error::$DEPLOY_PATH is not a git checkout yet. Run drift.yml, read it, then run this workflow once with confirm=adopt."; exit 1
            fi
            $PHP artisan down --retry=30 || true
            git init -q
            git remote add origin "$REPO_URL"
            git fetch -q origin "$REFSPEC"
            git reset -q "origin/$BRANCH"
            echo "== Tracked files that differ on the host (replaced by origin/$BRANCH; copies are in the rollback tar):"
            git status --short | grep -v '^??' || echo "   (none)"
            git checkout -q -- .
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
          else
            echo "== Current release: $(git rev-parse --short HEAD)"
            if [ "$MODE" = "adopt" ]; then
              # The folder is already a checkout, but of the host's own history
              # (commits that were never pushed). Keep that history on a branch
              # before main replaces the files, so nothing is lost even if the
              # rollback copy is later deleted.
              KEEP="host-before-adopt-$STAMP"
              git branch -f "$KEEP" HEAD
              echo "== Host history kept on local branch $KEEP (also inside the rollback copy)."
              echo "== Remote before: $(git remote get-url origin 2>/dev/null | sed 's#//[^@/]*@#//#' || echo none)"
              if git remote get-url origin >/dev/null 2>&1; then git remote set-url origin "$REPO_URL"; else git remote add origin "$REPO_URL"; fi
              echo "== Tracked files that differ or are deleted on the host (replaced by main; copies are in the rollback tar):"
              git status --short | grep -v '^??' | head -40 || echo "   (none)"
            fi
            git fetch -q origin "$REFSPEC"
            $PHP artisan down --retry=30 || true
            git reset --hard "origin/$BRANCH"
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
          fi
          echo "== Code: $(git rev-parse --short HEAD) ($BRANCH)"

          # ---- files on the host that main does not have
          # Untracked files survive a takeover on purpose (.env, uploads, local
          # state), so say what they are instead of only counting them.
          UNTRACKED="$(git ls-files --others --exclude-standard | grep -vE '^(storage/|bootstrap/cache/|public/build|database/[^/]*[.]sqlite|[.]htaccess)' || true)"
          if [ -n "$UNTRACKED" ]; then
            echo "== Files on the host that main does not have (kept; first 40):"
            printf '%s\n' "$UNTRACKED" | head -40 | sed 's/^/   /'
          fi
          # A host-only MIGRATION is the exception: `migrate` would run it next to
          # main's own files. On the real Dot.Projects host a leftover
          # 2026_06_27_000001_create_projects_table sorts before main's
          # create_projects migration, which is not guarded by hasTable, so a
          # normal deploy would fail AFTER maintenance mode started (reproduced on a
          # fake host). Move such files aside, never delete them; they are also
          # in the rollback copy.
          ORPHANS="$(git ls-files --others --exclude-standard -- database/migrations || true)"
          if [ -n "$ORPHANS" ]; then
            QUARANTINE="$HOME/dot-tutor-quarantine-$STAMP"
            mkdir -p "$QUARANTINE"
            printf '%s\n' "$ORPHANS" | while IFS= read -r f; do mv "$f" "$QUARANTINE/"; done
            echo "== Moved host-only migration file(s) aside (not in main; they would run beside main's own):"
            printf '%s\n' "$ORPHANS" | sed 's/^/   /'
            echo "   now in $QUARANTINE"
          fi

          composer install --no-interaction --optimize-autoloader --no-dev

          # ---- production invariants
          # APP_DEBUG=true makes any error, even a harmless 405, answer every
          # visitor with a ~840 KB debug page (ecosystem audit D9). Forced off
          # BEFORE the config cache is built so a hand-edited .env cannot put
          # it back.
          if grep -q '^APP_DEBUG=' .env; then
            sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          else
            printf '\nAPP_DEBUG=false\n' >> .env
          fi
          echo "== APP_DEBUG forced to false: $(grep '^APP_DEBUG=' .env | tail -1)"
          # APP_ENV=local on a live site mislabels errors and lets code that branches
          # on the environment behave as in development. Dot.Tutor's own checks all want
          # production here: the Demo* seeders refuse it and tutor:preflight judges by it.
          if grep -q '^APP_ENV=' .env; then
            sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
          else
            printf '\nAPP_ENV=production\n' >> .env
          fi
          echo "== APP_ENV forced to production: $(grep '^APP_ENV=' .env | tail -1)"
          # Not changed here (each is a choice about this host), but never silent.
          if grep -qE '^APP_URL=http://' .env; then echo "::warning::APP_URL is http://, not https://; set it to the https address."; fi
          if [ "$(envval BROADCAST_CONNECTION)" = "reverb" ]; then
            echo "::warning::BROADCAST_CONNECTION=reverb, but Reverb cannot run on shared cPanel. Dot.Tutor broadcasts nothing (screens poll); set BROADCAST_CONNECTION=log."
          fi
          for KEYNAME in QUEUE_CONNECTION CACHE_STORE SESSION_DRIVER; do
            if [ "$(envval "$KEYNAME")" = "redis" ]; then echo "::warning::$KEYNAME=redis, but this host has no Redis. Use database."; fi
          done
          if [ "$(envval QUEUE_CONNECTION)" = "sync" ]; then
            echo "::warning::QUEUE_CONNECTION=sync: Paystack webhooks and notification delivery run inside the web request and the cron worker has nothing to do. Use database."
          fi
          # ---- frontend: swap the staged build in, keep the docroot copy in step
          # public/build is gitignored, so git never refreshes it. The docroot
          # may serve its own build/ (a symlink, or on this host sometimes a
          # separate copy: Dot.Doc 404'd assets for days that way), and the
          # browser reads THAT one while @vite reads this app's manifest.
          rm -rf public/build.old
          [ -d public/build ] && mv public/build public/build.old
          mv public/build.incoming public/build
          rm -rf public/build.old
          LINK="$DOCROOT/build"
          if [ "$DOCROOT_IS_PUBLIC" = "1" ]; then
            echo "== docroot is $APPDIR/public itself; build/ is served directly"
          elif [ -L "$LINK" ]; then
            echo "== docroot build/ is a symlink; nothing to copy"
          elif [ -d "$LINK" ]; then
            rsync -a --delete public/build/ "$LINK/"
            echo "== docroot build/ is a real directory; mirrored from public/build"
          else
            ln -s "$APPDIR/public/build" "$LINK"
            echo "== docroot build/ did not exist; linked to $APPDIR/public/build"
          fi

          # ---- every other public file: fonts/, icons/, images/, comms/, comms-sw.js, robots.txt, favicons
          # Same trap as build/: the docroot may hold COPIES of public/ files that git never refreshes (InfoDot R-17, the
          # Dopemine pilot). R-47 adds self-hosted fonts, two icon sprites, the push script and the service worker, so
          # every top-level entry of public/ except the build folders, index.php, .htaccess, hot and storage is kept in
          # step, and a new static file is picked up without editing this workflow:
          #   a folder - missing in the docroot: linked to <app>/public/<name>; a symlink: left alone; a real folder:
          #              rsync -a (adds and overwrites the files the app ships, DELETES nothing);
          #   a file   - missing: linked; a symlink or identical: left alone; different: the docroot copy is moved to
          #              ~/dot-tutor-docroot-before-<time>/ (outside every web root) and replaced by a link.
          # comms-sw.js must sit at the docroot ROOT: its scope is the folder it is served from, and push.js registers it
          # as /comms-sw.js with scope /. Nothing under storage/ is ever synced: uploads live on private disks.
          if [ "$DOCROOT_IS_PUBLIC" = "1" ]; then
            echo "== static files: the document root is $APPDIR/public itself; nothing to sync"
          else
            KEPT="$HOME/dot-tutor-docroot-before-$STAMP"
            for ENTRY in $(cd public && ls -A); do
              case "$ENTRY" in
                build|build.incoming|build.old|index.php|.htaccess|hot|storage|.gitignore|.DS_Store) continue ;;
              esac
              SRC="public/$ENTRY"; DST="$DOCROOT/$ENTRY"
              if [ -d "$SRC" ] && [ ! -L "$SRC" ]; then
                if [ -L "$DST" ]; then echo "== static $ENTRY/: docroot entry is a symlink; nothing to copy"
                elif [ -d "$DST" ]; then
                  rsync -a "$SRC/" "$DST/"
                  echo "== static $ENTRY/: docroot is a real directory; mirrored from public/$ENTRY (nothing deleted)"
                elif [ -e "$DST" ]; then echo "::warning::static $ENTRY: $DST exists and is not a directory; left alone"
                else
                  ln -s "$APPDIR/public/$ENTRY" "$DST"
                  echo "== static $ENTRY/: did not exist in the docroot; linked to $APPDIR/public/$ENTRY"
                fi
              else
                if [ -L "$DST" ]; then :
                elif [ ! -e "$DST" ]; then
                  ln -s "$APPDIR/public/$ENTRY" "$DST"
                  echo "== static file $ENTRY: linked into the docroot"
                elif [ -f "$DST" ] && ! cmp -s "$SRC" "$DST"; then
                  mkdir -p "$KEPT" && chmod 700 "$KEPT"
                  mv "$DST" "$KEPT/$ENTRY"
                  ln -s "$APPDIR/public/$ENTRY" "$DST"
                  echo "== static file $ENTRY: the docroot held an older copy (kept in $KEPT); now linked to the app's file"
                fi
              fi
            done
            # R-47 moved the classroom sprite to icons/classroom.svg: a classroom/ folder left in the docroot would shadow
            # the /classroom page on Apache (a real folder is served before index.php). Move it out, never delete it.
            if [ -e "$DOCROOT/classroom" ] && [ ! -e public/classroom ]; then
              mkdir -p "$KEPT" && chmod 700 "$KEPT"
              mv "$DOCROOT/classroom" "$KEPT/classroom"
              echo "== docroot classroom/ moved to $KEPT: it would shadow the /classroom page"
            fi
          fi

          # ---- private storage every domain writes to (never under the docroot)
          mkdir -p storage/app/private/safety storage/app/private/learning storage/app/private/lesson-resources \
                   storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

          # ---- database
          echo "== Pending migrations:"
          $PHP artisan migrate:status --pending 2>&1 | tail -25 || true
          if [ "$MIGRATE" = "yes" ]; then
            $PHP artisan migrate --force
            # ---- reference data. Languages, countries, curricula, levels, the subject catalogue, offerings, starter
            # topics and public universities, and the mapping of pre-R-47 subjects onto the catalogue (no id changes, no
            # level text rewritten). Idempotent: only missing rows are inserted, nothing an operator edited is
            # overwritten, nothing is deleted. It is not a migration (D-202), so it runs here, after every migrate.
            $PHP artisan academic:sync
          else
            echo "== Migrations NOT run (takeover). Read the list above; the next confirm=deploy runs them, or re-run with migrate=migrate."
          fi

          # Targeted clears, NOT optimize:clear: that also empties the cache
          # store, which here is the database. If the host database lacks the
          # cache table the deploy would crash with the site in maintenance
          # mode (found by running this script against a fake host), and a
          # release has no business flushing sessions' companions anyway.
          $PHP artisan config:clear
          $PHP artisan route:clear
          $PHP artisan view:clear
          $PHP artisan event:clear
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache
          $PHP artisan schedule:list

          # ---- the environment, the data and the build, judged by the app itself. FAIL lines stop the release with
          # the site still in maintenance mode; WARN, INFO and OFF lines never do (Paystack, mail, AI, push, TURN and
          # operators are owner steps the preflight names: read its "Can a learner book a paid lesson?" line). Skipped
          # on a takeover that did not migrate: the schema is knowingly behind then.
          if [ "$MIGRATE" = "yes" ]; then
            if ! $PHP artisan tutor:preflight; then
              echo "::error::tutor:preflight reported FAIL lines (above). The site stays in maintenance mode on purpose. Fix the cause (usually .env, a PHP extension or limit in cPanel, or a folder permission) and run the workflow again; it brings the site back up itself. Rollback copy: $BACKUP. Database copy: ${DBDUMP:-none}."; exit 1
            fi
          else
            echo "== tutor:preflight skipped: this takeover did not run migrations."
          fi

          $PHP artisan up
          trap - ERR
          echo "== Deployed: $(git rev-parse --short HEAD)"
          DEPLOY

      - name: Install the cron lines
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$APP_PATH" \
              'bash -s' <<'CRON'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-tutor"
          # Spread the load on the shared account. 43 cron lines used to fire in the same second and
          # the host answered "fork: Resource temporarily unavailable" (2026-10-19), so scheduler and
          # queue runs started late or not at all. `exec` drops the sh parent (one process per line instead
          # of two); the queue worker runs every second minute, on this app's own parity, so about half
          # of the workers start in any given minute. A queued job waits at most about two minutes.
          QMIN="$(( $(printf %s "$MARK" | cksum | cut -d" " -f1) % 2 ))-59/2"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local _
            for _ in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          KEY="${MARK#\# dot-}"
          EXPECT_MINE=2
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          # A hand-made line for this app (no marker) is kept, never edited: say so, because the scheduler or worker
          # would then run twice.
          STRAY="$(grep -v "$MARK" "$OLD" | grep -F "$DEPLOY_PATH" | grep -E 'artisan (schedule:run|queue:work)' || true)"
          if [ -n "$STRAY" ]; then
            echo "::warning::unmarked cron line(s) for this app exist and were left alone; delete them in cPanel (Cron Jobs) or the scheduler/worker runs twice:"
            printf '%s\n' "$STRAY" | sed 's/^/   /'
          fi
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
            echo "$QMIN * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan queue:work --stop-when-empty --tries=3 --timeout=60 --max-time=50 > storage/logs/cron-queue.log 2>&1 $MARK"
          } > "$NEW"
          # Runner mode (docs/programme/REMEDIATION_ROADMAP.md, R-1): when the account runs the bounded-concurrency
          # cron runner (InfoDot: Cron Runner workflow, "install"), this app's commands go to ~/.dot-cron.d/$KEY.cron
          # and the runner starts them, at most 4 at a time. Its own crontab lines are then removed (a migration on
          # deploy). Without the runner the crontab lines above are installed exactly as before.
          if [ -x "$HOME/bin/dot-cron-runner" ] && grep -q '# dot-cron-runner' "$OLD"; then
            CMDS="$(grep -F -- "$MARK" "$NEW" | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ //; s/ *# dot-[a-z0-9-]*$//' || true)"
            mkdir -p "$HOME/.dot-cron.d"
            if [ -n "$CMDS" ]; then
              printf '%s\n' "$CMDS" > "$HOME/.dot-cron.d/$KEY.cron.tmp" && mv "$HOME/.dot-cron.d/$KEY.cron.tmp" "$HOME/.dot-cron.d/$KEY.cron"
            else
              rm -f "$HOME/.dot-cron.d/$KEY.cron"
            fi
            grep -v -F -- "$MARK" "$NEW" > "$NEW.t" || true; mv "$NEW.t" "$NEW"
            EXPECT_MINE=0
            echo "== runner mode: $(printf '%s' "$CMDS" | grep -c . || true) command(s) written to ~/.dot-cron.d/$KEY.cron, none left in the crontab"
          fi
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "$EXPECT_MINE" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE, expected=$EXPECT_MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"
          # The cron worker exits when idle and starts fresh each run; queue:restart makes one that is mid-run finish and
          # exit now. It writes to the cache store, so a missing cache table only warns.
          $PHP artisan queue:restart || echo "::warning::queue:restart failed (cache store unreachable?); a worker started before this release may run old code for up to a minute."
          CRON
      - name: Smoke-check the live site
        run: |
          set -uo pipefail
          WORK="$(mktemp -d)"
          FAILED=0
          bad() { echo "::error::$*"; FAILED=1; }
          # The shared host's edge firewall now and then refuses a runner IP (403) or a request times out (000): ask up to
          # three times before calling a page broken, as the Dot.Agents scheduler watchdog does.
          # fetch URL WANT [curl args...]: headers in $WORK/h, body in $WORK/b, prints the final code.
          fetch() {
            local url="$1" want="$2" code="" i; shift 2
            for i in 1 2 3; do
              code=$(curl -s --max-time 30 -D "$WORK/h" -o "$WORK/b" -w '%{http_code}' "$@" "$url" || true)
              [ "$code" = "$want" ] && break
              case "$code" in 403|000|502|503|504) [ "$i" -lt 3 ] && sleep 5 ;; *) break ;; esac
            done
            printf '%s' "$code"
          }

          # ---- pages a guest can open
          for PAGE in "/" "/login" "/up"; do
            CODE=$(fetch "$SITE_URL$PAGE" 200)
            if [ "$CODE" = "200" ]; then echo "200 $PAGE"; else bad "$SITE_URL$PAGE answered ${CODE:-no response} (expected 200)"; fi
          done
          # The learner, tutor, guardian and operator areas redirect a guest to the login (a 200 would mean the auth
          # middleware is gone, a 500 broken routes, a 403 a docroot folder shadowing the route).
          for PAGE in /learn /tutor/profile /my/bookings /classroom /safety/guardian /operator/tutor-profiles /safety/operator/queue /money/ops; do
            curl -s --max-time 30 -D "$WORK/h" -o /dev/null "$SITE_URL$PAGE" || true
            if head -1 "$WORK/h" | grep -qE ' 30[12] ' && grep -qi '^location:.*/login' "$WORK/h"; then echo "302 $PAGE -> /login"; else bad "$PAGE did not redirect a guest to /login: $(head -1 "$WORK/h" | tr -d '\r')"; fi
          done
          # A guessed private file is never served: the private disks are outside the docroot, and Laravel's /storage
          # route (when routes are not cached) answers only to a signed URL.
          BOGUS="$(python3 -c 'import secrets; print(secrets.token_hex(12))')"  # no tr|head pipe: under pipefail it dies of SIGPIPE
          for P in "/storage/lesson-resources/$BOGUS.pdf" "/storage/safety/$BOGUS.png" "/storage/learning/$BOGUS.pdf" "/lesson-resources/$BOGUS.pdf"; do
            CODE=$(curl -s --max-time 15 -o "$WORK/b" -w '%{http_code}' "$SITE_URL$P" || true)
            case "$CODE" in 403|404) echo "$CODE $P (guessed private file, not served)" ;; *) bad "$P answered ${CODE:-no response}; a guessed private file must answer 403 or 404" ;; esac
          done
          # Security headers (SecurityHeaders middleware) on a guest page, and which CSP mode is live.
          fetch "$SITE_URL/login" 200 > /dev/null
          for HDR in x-content-type-options x-frame-options referrer-policy permissions-policy; do
            if grep -Eqi "^$HDR:" "$WORK/h"; then echo "header $HDR present"; else bad "header $HDR missing on /login"; fi
          done
          if grep -qi '^strict-transport-security:' "$WORK/h"; then echo "header strict-transport-security present"; else echo "::warning::no Strict-Transport-Security on /login (SECURITY_HSTS_SECONDS=0 in the host .env?)"; fi
          if grep -qi '^content-security-policy:' "$WORK/h"; then echo "Content-Security-Policy: ENFORCED"
          elif grep -qi '^content-security-policy-report-only:' "$WORK/h"; then echo "Content-Security-Policy: report-only (SECURITY_CSP_REPORT_ONLY=true): violations are reported, nothing is blocked"
          else bad "no Content-Security-Policy header on /login"; fi

          # ---- what the DOCROOT must serve: the build, fonts, icon sprites, the service worker
          for ASSET in $(python3 -c "import json; m=json.load(open('public/build/manifest.json')); print(' '.join(sorted({v['file'] for v in m.values() if v.get('isEntry')} | {f for v in m.values() if v.get('isEntry') for f in v.get('css', [])})))"); do
            CODE=$(fetch "$SITE_URL/build/$ASSET" 200)
            if [ "$CODE" = "200" ]; then echo "200 /build/$ASSET"; else bad "$SITE_URL/build/$ASSET answered ${CODE:-no response} (expected 200): the docroot is not serving the new build"; fi
          done
          for F in $(cd public && ls fonts/*.woff2); do
            CODE=$(fetch "$SITE_URL/$F" 200)
            CT=$(grep -i '^content-type:' "$WORK/h" | tail -1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')
            if [ "$CODE" = "200" ] && [ "$(head -c4 "$WORK/b")" = "wOF2" ] && ! echo "$CT" | grep -q 'text/html'; then echo "200 /$F (${CT#content-type: })"
            else bad "$SITE_URL/$F answered ${CODE:-no response} / $CT / not a woff2 file: the docroot is not serving the fonts"; fi
          done
          for F in icons/td-sprite.svg icons/classroom.svg; do
            CODE=$(fetch "$SITE_URL/$F" 200)
            if [ "$CODE" = "200" ] && grep -q '<svg' "$WORK/b"; then echo "200 /$F (icon sprite)"; else bad "$SITE_URL/$F answered ${CODE:-no response} or is not an SVG: icons would be blank"; fi
          done
          CODE=$(fetch "$SITE_URL/comms-sw.js" 200)
          CT=$(grep -i '^content-type:' "$WORK/h" | tail -1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          if [ "$CODE" = "200" ] && cmp -s "$WORK/b" public/comms-sw.js && echo "$CT" | grep -qE '(application|text)/javascript'; then echo "200 /comms-sw.js at the site root, this release's copy, ${CT#content-type: } (scope /)"
          else
            SAME="NOT this release's copy"; cmp -s "$WORK/b" public/comms-sw.js && SAME="this release's copy"
            bad "/comms-sw.js answered ${CODE:-no response}, type ${CT:-none}, $SAME: push notifications would be refused or stale"
          fi
          # One file from every static folder and every static root file the checkout ships.
          for ENTRY in $(cd public && ls -A); do
            case "$ENTRY" in build|build.incoming|build.old|index.php|.htaccess|hot|storage|.gitignore|.DS_Store|comms-sw.js|fonts) continue ;; esac
            if [ -d "public/$ENTRY" ]; then PROBE="$ENTRY/$(cd "public/$ENTRY" && find . -type f ! -name 'LICEN*' ! -name '.*' | sort | head -1 | sed 's#^\./##')"; else PROBE="$ENTRY"; fi
            [ -s "public/$PROBE" ] || continue  # an empty placeholder proves nothing
            CODE=$(fetch "$SITE_URL/$PROBE" 200)
            if [ "$CODE" = "200" ]; then echo "200 /$PROBE"; else bad "$SITE_URL/$PROBE answered ${CODE:-no response} (expected 200): the docroot does not serve public/$ENTRY"; fi
          done

          # ---- never served
          for P in storage/app/private storage/app/private/safety storage/app/private/learning storage/logs/laravel.log .env; do
            CODE=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' "$SITE_URL/$P" || true)
            if [ "$CODE" = "200" ]; then bad "$SITE_URL/$P answered 200: private storage is exposed"; else echo "${CODE:-000} /$P (not served)"; fi
          done
          # A GET-only route answering POST is a harmless 405: ~1 KB in production, an ~840 KB stack-trace page when
          # APP_DEBUG is on.
          curl -s --max-time 30 -o "$WORK/probe.html" -X POST "$SITE_URL/up" || true
          if grep -qiE 'vendor/laravel|stack trace' "$WORK/probe.html"; then
            bad "POST $SITE_URL/up answered with a debug error page: APP_DEBUG is still on."
          else
            echo "No debug page on POST /up ($(wc -c < "$WORK/probe.html" | tr -d ' ') bytes)"
          fi
          rm -rf "$WORK"
          [ "$FAILED" -eq 0 ] || { echo "::error::Smoke check failed: the deploy is NOT healthy."; exit 1; }
          echo "== Smoke check passed."

      - name: Probe the application folder from outside
        if: ${{ !cancelled() }}
        # Public requests only (no SSH, nothing is read): the app folder next to the docroot
        # must answer 403/404 (or a 301/302 to the login), never 200. Found 2026-10-20
        # serving its database, logs and vendor/ on four platforms. Runs after the site is
        # live again, so it can only turn the run red. Only status codes are printed.
        run: |
          set -uo pipefail
          KEY="$(basename "$APP_PATH")"
          [ -n "$KEY" ] && [ "$KEY" != "/" ] || { echo "::error::cannot work out the app folder name; the probe did not run"; exit 1; }
          EXPOSED=0
          UNREACHED=0
          for P in .env .env.bak-secrets artisan composer.json composer.lock database/database.sqlite storage/logs/laravel.log vendor/autoload.php phpunit.xml; do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/$KEY/$P" || true)
            case "$CODE" in
              200) echo "::error::EXPOSED /$KEY/$P answered 200"; EXPOSED=1 ;;
              000) echo "000 /$KEY/$P (no answer)"; UNREACHED=$((UNREACHED + 1)) ;;
              *) echo "$CODE /$KEY/$P" ;;
            esac
          done
          [ "$UNREACHED" -eq 0 ] || echo "::warning::$UNREACHED probe request(s) got no answer; those paths are unverified."
          if [ "$EXPOSED" -ne 0 ]; then
            echo "::error::The application folder is readable over HTTP (database, logs or vendor/ may be downloadable). Run the App Folder Guard workflow in InfoDot (mode apply) or add the deny file by hand, then re-run."
            exit 1
          fi
          echo "== App-folder probe: no sensitive path answered 200 ($((9 - UNREACHED)) of 9 paths verified)."
